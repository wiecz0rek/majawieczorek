  <script>
    let scene, camera, renderer;
    let floatingCards = [];
    let bokehParticles;
    let mouseX = 0, mouseY = 0;

    const portfolioSources = [
      'https://i.postimg.cc/NFJCX9Gt/final-cover-jpg.png',
      'https://i.postimg.cc/nrRgVGHC/magnific-keep-the-current-composit-4RYrm2B9Aa.png',
      'https://i.postimg.cc/FzWCSdFh/money-fire-png.png',
      'https://i.postimg.cc/KjqpTkcy/bg-house-jpg.jpg',
      'https://i.postimg.cc/C5Pr8BhX/raw-man-jpg.png'
    ];

    function init3DBackground() {
      const canvas = document.getElementById('bg-webgl-canvas');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 18;

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      // Spokojne, ciepłe fioletowo-różowe oświetlenie sceny
      const pinkGlow = new THREE.PointLight(0xd946ef, 3.2, 50);
      pinkGlow.position.set(0, -4, 10);
      scene.add(pinkGlow);

      const purpleGlow = new THREE.PointLight(0xa855f7, 2.0, 50);
      purpleGlow.position.set(12, 12, 8);
      scene.add(purpleGlow);

      createFloatingSquares();
      createBokehField();

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      window.addEventListener('resize', onWindowResize);
      animate3DScene();
    }

    function createBlurredSquareTexture(imgElement, blurPx = 12) {
      const canvas = document.createElement('canvas');
      canvas.width = 384;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');
      const cornerRadius = 32;

      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(12, 12, canvas.width - 24, canvas.height - 24, cornerRadius);
      } else {
        ctx.rect(12, 12, canvas.width - 24, canvas.height - 24);
      }
      ctx.clip();

      ctx.filter = `blur(${blurPx}px)`;

      if (imgElement && imgElement.complete && imgElement.naturalWidth > 0) {
        const nw = imgElement.naturalWidth;
        const nh = imgElement.naturalHeight;
        const minDim = Math.min(nw, nh);
        const sx = (nw - minDim) / 2;
        const sy = (nh - minDim) / 2;
        ctx.drawImage(imgElement, sx, sy, minDim, minDim, 0, 0, canvas.width, canvas.height);
      } else {
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#260b26');
        grad.addColorStop(0.5, '#c026d3');
        grad.addColorStop(1, '#06050a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.filter = 'none';

      ctx.fillStyle = 'rgba(6, 5, 10, 0.32)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      // Elegancka różowa krawędź kafelka
      ctx.strokeStyle = 'rgba(217, 70, 239, 0.45)';
      ctx.lineWidth = 5;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(12, 12, canvas.width - 24, canvas.height - 24, cornerRadius);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return { texture, canvas, ctx, imgElement };
    }

    function createFloatingSquares() {
      const squareGeo = new THREE.PlaneGeometry(3.2, 3.2);
      const cardCount = window.innerWidth < 768 ? 16 : 28;

      const loadedImgs = portfolioSources.map(src => {
        const img = new Image();
        img.src = src;
        return img;
      });

      for (let i = 0; i < cardCount; i++) {
        const imgItem = loadedImgs[i % loadedImgs.length];
        const blurAmount = 8 + (i % 3) * 3;
        const texObj = createBlurredSquareTexture(imgItem, blurAmount);

        if (imgItem.complete && imgItem.naturalWidth > 0) {
          refreshTexture(texObj, blurAmount);
        } else {
          imgItem.onload = () => {
            refreshTexture(texObj, blurAmount);
          };
        }

        const material = new THREE.MeshStandardMaterial({
          map: texObj.texture,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.0,
          roughness: 0.3,
          metalness: 0.15
        });

        const mesh = new THREE.Mesh(squareGeo, material);
        
        const baseX = (Math.random() - 0.5) * 34;
        const baseY = (Math.random() - 0.5) * 24;
        const baseZ = (Math.random() - 0.5) * 22 - 3;

        mesh.position.set(baseX, baseY, baseZ);
        mesh.rotation.set(
          (Math.random() - 0.5) * 0.4,
          (Math.random() - 0.5) * 0.4,
          (Math.random() - 0.5) * 0.3
        );
        const scale = 0.8 + Math.random() * 0.5;
        mesh.scale.set(scale, scale, scale);

        scene.add(mesh);

        floatingCards.push({
          mesh: mesh,
          material: material,
          baseX: baseX,
          baseY: baseY,
          baseZ: baseZ,
          phase: Math.random() * Math.PI * 2,
          fadeSpeed: 0.4 + Math.random() * 0.5,
          maxOpacity: 0.35 + (i % 3) * 0.12,
          swaySpeed: 0.3 + Math.random() * 0.3
        });
      }
    }

    function refreshTexture(texObj, blurPx) {
      const c = texObj.canvas;
      const ctx = texObj.ctx;
      const cornerRadius = 32;

      ctx.clearRect(0, 0, c.width, c.height);

      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(12, 12, c.width - 24, c.height - 24, cornerRadius);
      } else {
        ctx.rect(12, 12, c.width - 24, c.height - 24);
      }
      ctx.clip();

      ctx.filter = `blur(${blurPx}px)`;

      const img = texObj.imgElement;
      if (img && img.naturalWidth > 0) {
        const nw = img.naturalWidth;
        const nh = img.naturalHeight;
        const minDim = Math.min(nw, nh);
        const sx = (nw - minDim) / 2;
        const sy = (nh - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, c.width, c.height);
      }
      ctx.filter = 'none';

      ctx.fillStyle = 'rgba(6, 5, 10, 0.32)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.restore();

      ctx.strokeStyle = 'rgba(217, 70, 239, 0.45)';
      ctx.lineWidth = 5;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(12, 12, c.width - 24, c.height - 24, cornerRadius);
        ctx.stroke();
      }

      texObj.texture.needsUpdate = true;
    }

    function createBokehField() {
      const count = 75;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 40;
        pos[i + 1] = (Math.random() - 0.5) * 30;
        pos[i + 2] = (Math.random() - 0.5) * 30;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      const bokehCanvas = document.createElement('canvas');
      bokehCanvas.width = 64;
      bokehCanvas.height = 64;
      const bCtx = bokehCanvas.getContext('2d');
      const grad = bCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(240, 171, 252, 0.85)');
      grad.addColorStop(0.5, 'rgba(217, 70, 239, 0.25)');
      grad.addColorStop(1, 'rgba(217, 70, 239, 0)');
      bCtx.fillStyle = grad;
      bCtx.fillRect(0, 0, 64, 64);

      const bokehTex = new THREE.CanvasTexture(bokehCanvas);
      const mat = new THREE.PointsMaterial({
        size: 1.4,
        map: bokehTex,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      bokehParticles = new THREE.Points(geo, mat);
      scene.add(bokehParticles);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate3DScene() {
      requestAnimationFrame(animate3DScene);

      camera.position.x += (mouseX * 2.0 - camera.position.x) * 0.035;
      camera.position.y += (mouseY * 1.5 - camera.position.y) * 0.035;
      camera.lookAt(0, 0, 0);

      const time = performance.now() * 0.001;

      for (let i = 0; i < floatingCards.length; i++) {
        const c = floatingCards[i];
        const pulse = (Math.sin(time * c.fadeSpeed + c.phase) + 1) / 2;
        c.material.opacity = 0.05 + pulse * c.maxOpacity;
        c.mesh.position.y = c.baseY + Math.sin(time * c.swaySpeed + c.phase) * 0.7;
        c.mesh.position.x = c.baseX + Math.cos(time * (c.swaySpeed * 0.7) + c.phase) * 0.5;
        c.mesh.rotation.z = Math.sin(time * 0.2 + c.phase) * 0.08;
      }

      if (bokehParticles) {
        const arr = bokehParticles.geometry.attributes.position.array;
        for (let b = 1; b < arr.length; b += 3) {
          arr[b] += 0.008;
          if (arr[b] > 15) arr[b] = -15;
        }
        bokehParticles.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    // Suwak Before / After zoptymalizowany pod kątem braku skalowania
    function setupComparisonSlider() {
      const container = document.getElementById('compare-container');
      const before = document.getElementById('compare-before');
      const divider = document.getElementById('compare-divider');
      let isDragging = false;

      function move(clientX) {
        if (!container) return;
        const rect = container.getBoundingClientRect();
        let x = clientX - rect.left;
        if (x < 0) x = 0;
        if (x > rect.width) x = rect.width;
        const pct = (x / rect.width) * 100;
        
        // Płynne przycinanie przez clip-path - zdjęcie w ogóle się nie skaluje!
        before.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
        divider.style.left = pct + '%';
      }

      if (container) {
        container.addEventListener('mousedown', (e) => {
          isDragging = true;
          move(e.clientX);
        });
        window.addEventListener('mousemove', (e) => {
          if (isDragging) move(e.clientX);
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        container.addEventListener('touchstart', (e) => {
          isDragging = true;
          move(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
          if (isDragging) move(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchend', () => { isDragging = false; });
      }
    }

    // Kopiowanie Discorda i powiadomienie toast
    function showToast(msg) {
      const toast = document.getElementById('toast-notify');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;

      text.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    function copyDiscordHandle() {
      const handle = 'wiecz0rek_';
      const el = document.createElement('input');
      el.value = handle;
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        showToast('Discord copied: ' + handle);
      } catch (err) {
        showToast('Discord: ' + handle);
      }
      document.body.removeChild(el);
    }

    // Inicjalizacja po załadowaniu DOM
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => {
        init3DBackground();
        setupComparisonSlider();
      });
    } else {
      init3DBackground();
      setupComparisonSlider();
    }
  </script>
</body>
</html>
